name: Publish contents

on:
  push:
    branches:
      - main

# ビルド時の日付処理（記事日付・RSS・llms等）を日本時間で行う
env:
  TZ: Asia/Tokyo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Prepare SSH key
        env:
          ID_ED25519: ${{ secrets.ID_ED25519 }}
        run: |
          mkdir -p ~/.ssh
          echo "$ID_ED25519\n" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
        shell: bash

      # ビルドとデプロイ（ナレッジの zip の送信を含む）は、手元と同じ deploy.sh で行う
      - name: Build and deploy
        env:
          DEPLOY_HOST: ${{ vars.SSH_USER }}@${{ vars.SSH_HOST }}
        run: |
          export RSYNC_RSH="ssh -i $HOME/.ssh/id_ed25519 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          bash deploy.sh
        shell: bash

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/id_ed25519
