name: Publish contents

on:
  push:
    branches:
      - main

# ビルド時の日付処理（記事日付・RSS・llms等）を日本時間で行う
env:
  TZ: Asia/Tokyo

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn build

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WEB_G6_DEPLOY_KEY }}" > ~/.ssh/web-g6-deploy
          chmod 600 ~/.ssh/web-g6-deploy
          # web-g6 のホスト鍵を固定する（ssh-keyscan で取ると、なりすましたサーバーにも繋いでしまう）
          echo "66.42.39.68 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO/AE8mcqA55qtO8MaQyAaSaWWF7355fPCEtuEzOQSmX" > ~/.ssh/known_hosts

      # 鍵は web-g6 側で rrsync に縛ってあり、このサイトの html/ にしか書けない。宛先はその中からの相対
      - name: Deploy via rsync
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/web-g6-deploy -o IdentitiesOnly=yes" \
            .vitepress/dist/ \
            root@66.42.39.68:

      # ナレッジの zip（検索・LLM向け）。同じ鍵で送る。web-g6 の門番（/root/web/bin/deploy-gate）が
      # knowledge の incoming/notes.zip だけを置き換える（他のセットの zip には書けない）
      - name: Send knowledge zip
        run: ssh -i ~/.ssh/web-g6-deploy -o IdentitiesOnly=yes root@66.42.39.68 knowledge-zip < knowledge/notes.zip

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/web-g6-deploy
