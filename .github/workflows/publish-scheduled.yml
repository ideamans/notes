name: Publish scheduled drafts

# draft: true の記事のうち、date の日付が今日（日本時間）以前のものを毎朝公開する。
# 公開の判定は scripts/publish-scheduled.mjs。
#
# Actions のトークンで push したコミットでは publish.yml（push 起点）が起動しないので、
# このワークフローの中でデプロイまで行う（手順は publish.yml と同じ）。

on:
  schedule:
    # 日本時間 8:00（UTC 23:00）。SNS の投稿（9:00）より前に公開を済ませておく
    - cron: '0 23 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

# ビルド時の日付処理（記事日付・RSS・llms等）を日本時間で行う
env:
  TZ: Asia/Tokyo

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Publish past-due drafts
        id: publish
        run: node scripts/publish-scheduled.mjs

      - name: Commit and push
        if: steps.publish.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/
          git commit -m "publish: 予約した下書きを公開 ($(date +%Y-%m-%d))"
          git push

      - name: Install dependencies
        if: steps.publish.outputs.changed == 'true'
        run: yarn install

      - name: Build
        if: steps.publish.outputs.changed == 'true'
        run: yarn build

      - name: Setup SSH key
        if: steps.publish.outputs.changed == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.WEB_G6_DEPLOY_KEY }}" > ~/.ssh/web-g6-deploy
          chmod 600 ~/.ssh/web-g6-deploy
          # web-g6 のホスト鍵を固定する（ssh-keyscan で取ると、なりすましたサーバーにも繋いでしまう）
          echo "66.42.39.68 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIO/AE8mcqA55qtO8MaQyAaSaWWF7355fPCEtuEzOQSmX" > ~/.ssh/known_hosts

      # 鍵は web-g6 側で rrsync に縛ってあり、このサイトの html/ にしか書けない。宛先はその中からの相対。
      # ナレッジの zip（knowledge.ideamans.com/incoming/）は送れないので、手元の deploy.sh が送る
      - name: Deploy via rsync
        if: steps.publish.outputs.changed == 'true'
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/web-g6-deploy -o IdentitiesOnly=yes" \
            .vitepress/dist/ \
            root@66.42.39.68:

      - name: Remove SSH key
        if: always()
        run: rm -f ~/.ssh/web-g6-deploy
